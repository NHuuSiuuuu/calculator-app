<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator App</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
  </head>
  <body>
    <main class="app-shell" aria-label="Productivity app">
      <div class="workspace">
        <nav class="app-tabs" role="tablist" aria-label="App views">
          <button id="tab-calculator" class="app-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="panel-calculator" tabindex="0">Calculator</button>
          <button id="tab-todos" class="app-tab" type="button" role="tab" aria-selected="false" aria-controls="panel-todos" tabindex="-1">Todo List</button>
        </nav>

      <section id="panel-calculator" class="calculator app-panel is-active" role="tabpanel" aria-labelledby="tab-calculator">
        <header class="calculator__header">
          <div>
            <p class="eyebrow">Basic Calculator</p>
            <h1>Arithmetic Desk</h1>
          </div>
          <span class="status-pill">Ready</span>
        </header>

        <section class="display-panel" aria-live="polite">
          <div id="expression" class="expression" aria-label="Expression">&nbsp;</div>
          <output id="display" class="display" aria-label="Current value">0</output>
          <div id="error" class="error" role="alert"></div>
        </section>

        <section class="keypad" aria-label="Calculator keypad">
          <button type="button" class="key key--utility" data-key="clear">C</button>
          <button type="button" class="key key--utility" data-key="delete">Del</button>
          <button type="button" class="key key--operator" data-key="/">/</button>
          <button type="button" class="key key--operator" data-key="*">*</button>

          <button type="button" class="key" data-key="7">7</button>
          <button type="button" class="key" data-key="8">8</button>
          <button type="button" class="key" data-key="9">9</button>
          <button type="button" class="key key--operator" data-key="-">-</button>

          <button type="button" class="key" data-key="4">4</button>
          <button type="button" class="key" data-key="5">5</button>
          <button type="button" class="key" data-key="6">6</button>
          <button type="button" class="key key--operator" data-key="+">+</button>

          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2</button>
          <button type="button" class="key" data-key="3">3</button>
          <button type="button" class="key key--equals" data-key="=">=</button>

          <button type="button" class="key key--zero" data-key="0">0</button>
          <button type="button" class="key" data-key=".">.</button>
        </section>

        <section class="history-panel" aria-label="Calculation history">
          <h2>History</h2>
          <ol id="history" class="history-list">
            <li class="history-empty">No calculations yet</li>
          </ol>
        </section>
      </section>

      <section id="panel-todos" class="todo-panel app-panel" role="tabpanel" aria-labelledby="tab-todos" hidden>
        <header class="todo-panel__header">
          <div>
            <p class="eyebrow">Supabase Todo</p>
            <h1>Task List</h1>
          </div>
          <span id="todo-status" class="status-pill">Setup</span>
        </header>

        <form id="todo-form" class="todo-form">
          <label class="todo-label" for="todo-title">New todo</label>
          <div class="todo-compose">
            <input id="todo-title" class="todo-input" name="title" type="text" autocomplete="off" maxlength="120" placeholder="Add a task" />
            <button class="todo-add" type="submit">Add todo</button>
          </div>
        </form>

        <p id="todo-message" class="todo-message" role="status">Add Supabase config to load todos.</p>
        <ul id="todo-list" class="todo-list" aria-label="Todo items">
          <li class="todo-empty">No tasks yet</li>
        </ul>
      </section>
      </div>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
